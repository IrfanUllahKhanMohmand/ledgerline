services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ledgerline
      MINIO_ROOT_PASSWORD: ledgerlinepass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./apps/api
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      JWT_SECRET: dev-only-change-me
      DATABASE_URL: postgres://ledgerline:ledgerline@postgres:5432/ledgerline
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ledgerline
      S3_SECRET_KEY: ledgerlinepass
    depends_on:
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data:
